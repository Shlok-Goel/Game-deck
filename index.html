<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game View</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>

    </header>
    <main>
        <div class="content">
            <div class="border">
                <div class="img">
                    <img src="https://linda-hoang.com/wp-content/uploads/2014/10/img-placeholder-dark.jpg" alt="Game-image" class="game-image">
                    <div>
                        <h1 class="heading">LOADING...</h1>
                    </div>
                </div>

                <div class="text">
                    <div>
                        <h1 class="game-name">LOADING...</h1>
                        <p class="year">xxxx</p>
                        <br>

                    </div>
                   

                    <div class="desc">
                        <p>
                            ...
                        </p>
                    </div>
                </div>
                <br>
                <div class="button-box1">
                    <button type="button" class="inspect-button">INSPECT GAME</button>
                </div>
                <br>
                <div class="button-box2">
                    <div class="left-bn">
                        <button type="button" class="pass-button">
                            <img src="cross.png" alt="PASS" height="80">
                        </button>
                        <p class="pass">PASS</p>
                    </div>
                    <div class="right-bn">
                        <p class="WL">WISHLIST</p>
                        <button type="button" class="WL-button">
                            <img src="heart.png" alt="WISHLIST" height="80">
                        </button>
                    </div>
                </div>
            </div>
           
            
        </div>
    
    </main>
    <script src="script.js"></script>
</body>
</html>
