<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game View</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>

    </header>
    <main>
        <div class="content">
            <div class="img">
                <img src="https://wamu.org/wp-content/uploads/2017/04/farm_day_1920x1080_wide-d49994dd6440a8dd9a0f2d5a9e826ffdfdb47959-1500x844.png" alt="Game-image" class="game-image">
                <div>
                    <h1 class="heading">STARDEW VALLEY</h1>
                </div>
            </div>

            <div class="text">
                
                <h1 class="game-name">STARDEW VALLEY</h1>
                <p class="year">2016</p>

                <div class="tags">
                    <p>
                            tag_1
                            tag_2
                            tag_3
                    </p>
                </div>

                <div class="desc">
                    <p>
                        Players take the role of a character who inherits their deceased grandfather's dilapidated farm. The game is open-ended, with players managing the farm by clearing land, growing seasonal crops, and raising animals
                    </p>
                </div>
            </div>
            <br>
            <div class="button-box1">
                <button type="button" class="inspect-button">INSPECT GAME</button>
            </div>
            <br>
            <div class="button-box2">
                <div class="left-bn">
                    <button type="button" class="pass-button">
                        <img src="cross.png" alt="PASS" height="80">
                    </button>
                    <p class="pass">PASS</p>
                </div>
                <div class="right-bn">
                    <p class="WL">WISHLIST</p>
                    <button type="button" class="WL-button">
                        <img src="heart.png" alt="WISHLIST" height="80">
                    </button>
                </div>
            </div>
            
        </div>
    
    </main>
    
</body>
</html>
